name: Sync Upstream

on:
  schedule:
    - cron: '0 * * * *' # Run every hour
  workflow_dispatch: # Allow manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Configure Git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Add upstream remote
        run: git remote add upstream https://github.com/kawaii-not-kawaii/myrient-archieve.git

      - name: Fetch upstream
        run: git fetch upstream

      - name: Merge upstream changes
        run: |
          git merge upstream/main --strategy-option ours --allow-unrelated-histories -m "Merge upstream updates" || true
          
          # Delete their workflow file if it snuck in, and rewrite the most recent commit
          if [ -f .github/workflows/update-progress.yml ]; then
            git rm -rf .github/workflows/update-progress.yml
            git commit --amend --no-edit
          fi

      - name: Push changes
        run: git push origin main
