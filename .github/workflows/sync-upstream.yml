name: Sync Upstream

on:
  schedule:
    - cron: '0 * * * *' # Run every hour
  workflow_dispatch: # Allow manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Configure Git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Add upstream remote
        run: git remote add upstream https://github.com/kawaii-not-kawaii/myrient-archieve.git

      - name: Fetch upstream
        run: git fetch upstream

      - name: Merge upstream changes
        run: |
          git merge upstream/main --no-commit --strategy-option ours --allow-unrelated-histories || true
          # Remove their workflow to prevent permission issues
          git rm -rf .github/workflows/update-progress.yml || true
          git commit -m "Merge upstream updates" || true

      - name: Push changes
        run: git push origin main
