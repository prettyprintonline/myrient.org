name: Sync Upstream

on:
  schedule:
    - cron: '0 * * * *' # Run every hour
  workflow_dispatch: # Allow manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Configure Git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Add upstream remote
        run: git remote add upstream https://github.com/kawaii-not-kawaii/myrient-archieve.git

      - name: Fetch upstream
        run: git fetch upstream

      - name: Sync upstream data
        run: |
          # Explicitly pull ONLY the data updates to avoid touching workflows and HTML files
          git checkout upstream/main -- '*.json' '*.csv' 'manifests/' || true
          
          # Check for changes and commit
          git status
          git add -A
          git commit -m "Auto-sync upstream data updates" || true

      - name: Push changes
        run: git push origin main
